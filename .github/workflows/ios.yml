name: iOS
# The iOS app (mobile/ios), built the same way as the owner's other apps.
#
# Pull requests: an unsigned Release build on macOS, so iOS keeps compiling.
# By hand (Actions → iOS → Run workflow): an App Store build signed in the cloud
# (Xcode automatic signing with the App Store Connect API key: no certificate,
# profile or .p12 is kept anywhere) and, with upload_to_testflight, sent to
# TestFlight. An App Store Connect check runs first on ubuntu (the bundle id is
# registered with Sign in with Apple on, the app record exists, the next build
# number). The signed IPA is checked (entitlements included) before any upload.
#
# Secrets (the same values as in the owner's other app repositories):
# IOS_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (API key with the
# Admin role: cloud-managed distribution signing needs it). docs/ILOVA-RELIZ.md
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed build to TestFlight
        type: boolean
        default: false
      screenshots:
        description: Only take App Store screenshots (6.9-inch iPhone simulator, the live site, read-only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  APP_VERSION: 1.0.0
  BUNDLE_ID: uz.bugunbor.app

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch'
    # The app's E2E run on the largest iPhone simulator: its screenshots are the
    # 6.9-inch size App Store Connect asks for (1320×2868).
    name: App Store screenshots (simulator)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta \
            | python3 -c 'import re,sys; l=[x.strip() for x in sys.stdin if x.strip()]; print(max(l, key=lambda p: [int(n) for n in re.findall(r"\d+", p)]) if l else "")')
          [ -n "$XC" ] || { echo "::error::No Xcode 26 on this runner image"; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot the largest iPhone simulator with a clean status bar
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, items in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in items]
          pick = [d for d in devices if "Pro Max" in d["name"]] or [d for d in devices if "Plus" in d["name"]]
          print(sorted(pick, key=lambda d: d["name"])[-1]["udid"] if pick else "")')
          [ -n "$UDID" ] || { echo "::error::no Pro Max simulator"; xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: E2E with screenshots (live site, read-only)
        run: flutter drive -d "$UDID" --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart --dart-define=E2E=true --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Screenshot sizes
        if: always()
        run: python3 -c "import struct,glob; [print(f, struct.unpack('>II', open(f,'rb').read()[16:24])) for f in sorted(glob.glob('build/screenshots/*.png'))]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: mobile/build/screenshots
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: App Store Connect check
    if: github.event_name == 'workflow_dispatch' && !inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_number: ${{ steps.gate.outputs.next_build }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: mobile/tool
      - name: Install PyJWT
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "PyJWT==2.10.1" "cryptography==44.0.2"
      - name: Bundle id, app record and next build number
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: '"$RUNNER_TEMP/venv/bin/python" mobile/tool/asc.py gate --register --sign-in-with-apple --bundle-id "$BUNDLE_ID" --min-build "${{ github.run_number }}"'

  build:
    if: github.event_name == 'workflow_dispatch'
    name: Build (macOS)
    needs: gate
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' }}
      BUILD_NUMBER: ${{ needs.gate.outputs.build_number || github.run_number }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta \
            | python3 -c 'import re,sys; l=[x.strip() for x in sys.stdin if x.strip()]; print(max(l, key=lambda p: [int(n) for n in re.findall(r"\d+", p)]) if l else "")')
          [ -n "$XC" ] || { echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Unsigned Release build (pull requests)
        if: env.SIGNED != 'true'
        run: |
          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER" --build-name="$APP_VERSION" \
            --dart-define=APP_BUILD="$BUILD_NUMBER" --dart-define=APP_VERSION="$APP_VERSION" --dart-define=PUSH_ENABLED=false
          APP=build/ios/iphoneos/Runner.app
          for k in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption MinimumOSVersion DTSDKName; do
            echo "$k=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null || echo '(absent)')"
          done
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID" ] || { echo "::error::wrong bundle id"; exit 1; }
          echo "localizations: $(cd "$APP" && ls -d ./*.lproj | sed 's|^\./||; s|\.lproj$||' | tr '\n' ' ')"
          du -sh "$APP"

      - name: App Store Connect API key file
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 tool/asc.py write-p8 "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive (unsigned; signing happens at export)
        if: env.SIGNED == 'true'
        env:
          # Passed to xcodebuild as DEVELOPMENT_TEAM, so the archive names the team the export signs for.
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          flutter build ipa --release --no-codesign --build-number="$BUILD_NUMBER" --build-name="$APP_VERSION" \
            --dart-define=APP_BUILD="$BUILD_NUMBER" --dart-define=APP_VERSION="$APP_VERSION" --dart-define=PUSH_ENABLED=false
          test -d build/ios/archive/Runner.xcarchive
          # The export signs the app with the archive's own entitlements, and an
          # archive built without signing has none: Sign in with Apple would be
          # left out. A local signature (no certificate) carries them into the
          # archive; the export then signs everything again for the App Store.
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          find "$APP/Frameworks" "$APP/PlugIns" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) 2>/dev/null \
            | while read -r item; do codesign --force --sign - --timestamp=none "$item"; done
          codesign --force --sign - --timestamp=none --entitlements ios/Runner/Runner.entitlements "$APP"
          ENTITLEMENTS=$(codesign -d --entitlements - "$APP" 2>/dev/null)
          grep -q com.apple.developer.applesignin <<<"$ENTITLEMENTS" \
            || { echo "::error::the archived app has no Sign in with Apple entitlement"; exit 1; }

      - name: Export with cloud signing
        if: env.SIGNED == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "version=$APP_VERSION build=$BUILD_NUMBER"
          # One options file to export the IPA checked below, one to upload it.
          for DEST in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$DEST.plist" <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOT
          done
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -iE "error|fail|denied|permission" "$RUNNER_TEMP/export.log" | head -40; tail -40 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/export.log"

      - name: Verify the signed IPA
        if: env.SIGNED == 'true'
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)
          echo "IPA: $(basename "$IPA"), $(du -h "$IPA" | cut -f1)"
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/Runner.app"
          codesign --verify --deep --strict "$APP" && echo "codesign --verify --deep --strict: OK"
          grep -q "^Authority=Apple Distribution" <<<"$(codesign -dvv "$APP" 2>&1)" || { echo "::error::not signed with an Apple Distribution certificate"; exit 1; }
          I() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Info.plist" 2>/dev/null || echo "(absent)"; }
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption MinimumOSVersion DTSDKName; do echo "$k=$(I $k)"; done
          [ "$(I CFBundleIdentifier)" = "$BUNDLE_ID" ] || { echo "::error::wrong bundle id"; exit 1; }
          [ "$(I CFBundleVersion)" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion is not $BUILD_NUMBER"; exit 1; }
          [ "$(I ITSAppUsesNonExemptEncryption)" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption is not false"; exit 1; }
          case "$(I DTSDKName)" in iphoneos26*|iphoneos2[7-9]*) ;; *) echo "::error::not built with the iOS 26+ SDK"; exit 1 ;; esac
          # Sign in with Apple needs the entitlement in the signature and in the profile.
          ENTITLEMENTS=$(codesign -d --entitlements - "$APP" 2>/dev/null)
          PROFILE=$(security cms -D -i "$APP/embedded.mobileprovision")
          grep -q com.apple.developer.applesignin <<<"$ENTITLEMENTS" \
            || { echo "::error::the signed app has no Sign in with Apple entitlement"; exit 1; }
          grep -q com.apple.developer.applesignin <<<"$PROFILE" \
            || { echo "::error::the provisioning profile has no Sign in with Apple"; exit 1; }
          echo "Sign in with Apple entitlement: OK"

      - name: Upload to TestFlight (the build checked above)
        if: env.SIGNED == 'true' && inputs.upload_to_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/upload.log" 2>&1 \
            || { grep -iE "error|fail|denied|permission" "$RUNNER_TEMP/upload.log" | head -40; tail -40 "$RUNNER_TEMP/upload.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/upload.log"
          echo "iOS build $APP_VERSION ($BUILD_NUMBER): uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
