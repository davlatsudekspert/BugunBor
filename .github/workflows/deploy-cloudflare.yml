name: Deploy to Cloudflare (standalone test)

# Manually-triggered deploy to the operator's own Cloudflare account, separate from the
# OpenAI Sites-hosted preview this project is normally built for (see .openai/hosting.json).
# Runs on GitHub's runners so it isn't subject to any sandbox's outbound network policy.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - Workers Scripts:Edit + D1:Edit permissions
#   CLOUDFLARE_ACCOUNT_ID  - found on the Cloudflare dashboard's right sidebar
# Optional:
#   TELEGRAM_BOT_TOKEN            - lets the deployed /telegram Mini App verify initData, the
#                                   /login phone+Telegram flow send codes, and this workflow
#                                   register the bot webhook below. Without it, all three are
#                                   inert (POST /api/v1/telegram/webapp/auth returns 503; OTP
#                                   codes only ever reach the server console, never Telegram).
#   TELEGRAM_BOT_USERNAME         - the bot's @username (no @) — used to build /login's phone-
#                                   linking deep link. Defaults to "bugunborbot" if unset.
#   ADMIN_BOOTSTRAP_PHONE         - the phone number that can sign in at /admin/login as the
#                                   first (bootstrap) SUPER_ADMIN — see db/runtime.ts's
#                                   seedBootstrapAdmin(). Defaults to +998900000000 if unset.
#   ADMIN_BOOTSTRAP_TELEGRAM_CHAT_ID - the Telegram chat id that phone's login OTP is sent to
#                                   (get it by messaging the bot, then reading
#                                   https://api.telegram.org/bot<token>/getUpdates)
#
# TELEGRAM_WEBHOOK_SECRET is never a repo secret you set — this workflow generates a fresh
# one on every run, sets it as the Worker's secret, and registers the same value with
# Telegram's setWebhook in the same step, so the two can never drift out of sync.
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Cloudflare Worker name'
        required: false
        default: 'bugunbor-platform'
      d1_database_name:
        description: 'D1 database name (created if it does not already exist)'
        required: false
        default: 'bugunbor-platform-db'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      ADMIN_BOOTSTRAP_PHONE: ${{ secrets.ADMIN_BOOTSTRAP_PHONE }}
      ADMIN_BOOTSTRAP_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_BOOTSTRAP_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Rename the worker in the generated config
        run: |
          node -e "
            const fs = require('fs');
            const path = 'dist/server/wrangler.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.name = '${{ inputs.worker_name }}';
            fs.writeFileSync(path, JSON.stringify(config));
          "

      - name: Ensure the D1 database exists and wire its id into the config
        run: |
          set -euo pipefail
          NAME="${{ inputs.d1_database_name }}"
          EXISTING_ID=$(npx wrangler d1 list --json | node -e "
            const dbs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const match = dbs.find((db) => db.name === process.argv[1]);
            process.stdout.write(match ? match.uuid : '');
          " "$NAME")
          if [ -z "$EXISTING_ID" ]; then
            echo "Creating D1 database $NAME..."
            npx wrangler d1 create "$NAME"
            EXISTING_ID=$(npx wrangler d1 list --json | node -e "
              const dbs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const match = dbs.find((db) => db.name === process.argv[1]);
              process.stdout.write(match ? match.uuid : '');
            " "$NAME")
          fi
          if [ -z "$EXISTING_ID" ]; then
            echo "::error::Could not resolve the D1 database id for $NAME"
            exit 1
          fi
          echo "Using D1 database $NAME ($EXISTING_ID)"
          node -e "
            const fs = require('fs');
            const path = 'dist/server/wrangler.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            for (const db of config.d1_databases) {
              db.database_name = process.argv[1];
              db.database_id = process.argv[2];
            }
            fs.writeFileSync(path, JSON.stringify(config));
          " "$NAME" "$EXISTING_ID"

      - name: Deploy the Worker
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --config dist/server/wrangler.json | tee /tmp/deploy-output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy-output.txt | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set TELEGRAM_BOT_TOKEN secret (if provided)
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: echo "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config dist/server/wrangler.json

      - name: Set ADMIN_BOOTSTRAP_PHONE secret (if provided)
        if: ${{ env.ADMIN_BOOTSTRAP_PHONE != '' }}
        run: echo "$ADMIN_BOOTSTRAP_PHONE" | npx wrangler secret put ADMIN_BOOTSTRAP_PHONE --config dist/server/wrangler.json

      - name: Set ADMIN_BOOTSTRAP_TELEGRAM_CHAT_ID secret (if provided)
        if: ${{ env.ADMIN_BOOTSTRAP_TELEGRAM_CHAT_ID != '' }}
        run: echo "$ADMIN_BOOTSTRAP_TELEGRAM_CHAT_ID" | npx wrangler secret put ADMIN_BOOTSTRAP_TELEGRAM_CHAT_ID --config dist/server/wrangler.json

      - name: Set TELEGRAM_BOT_USERNAME secret (if provided)
        if: ${{ env.TELEGRAM_BOT_USERNAME != '' }}
        run: echo "$TELEGRAM_BOT_USERNAME" | npx wrangler secret put TELEGRAM_BOT_USERNAME --config dist/server/wrangler.json

      - name: Register the Telegram bot webhook (if a bot token is set)
        id: webhook
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          set -euo pipefail
          SECRET=$(openssl rand -hex 32)
          echo "$SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config dist/server/wrangler.json
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            --data-urlencode "url=${{ steps.deploy.outputs.url }}/api/v1/telegram/bot/webhook" \
            --data-urlencode "secret_token=$SECRET")
          echo "$RESPONSE"
          echo "ok=$(node -e "console.log(JSON.parse(process.argv[1]).ok)" "$RESPONSE")" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- Worker: \`${{ inputs.worker_name }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Telegram Mini App: ${{ steps.deploy.outputs.url }}/telegram"
            echo "- Admin login: ${{ steps.deploy.outputs.url }}/admin/login"
            echo "- Customer login: ${{ steps.deploy.outputs.url }}/login"
            if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "- ⚠️ TELEGRAM_BOT_TOKEN secret not set — /telegram, /login and the bot webhook are all inert until it is."
            elif [ "${{ steps.webhook.outputs.ok }}" != "true" ]; then
              echo "- ⚠️ Telegram setWebhook call did not confirm success — check the step log above."
            else
              echo "- ✅ Telegram bot webhook registered — /login's phone+Telegram flow is fully live."
            fi
            if [ -z "$ADMIN_BOOTSTRAP_PHONE" ]; then
              echo "- ⚠️ ADMIN_BOOTSTRAP_PHONE not set — the bootstrap admin still uses the +998900000000 placeholder."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
