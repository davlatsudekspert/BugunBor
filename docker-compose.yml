services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bugunbor
      POSTGRES_USER: bugunbor
      POSTGRES_PASSWORD: local-only-change-me
    ports: ['5432:5432']
    volumes: ['bugunbor-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bugunbor']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['bugunbor-redis:/data']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-bugunbor
      MINIO_ROOT_PASSWORD: local-only-change-me
    ports: ['9000:9000', '9001:9001']
    volumes: ['bugunbor-minio:/data']
volumes:
  bugunbor-postgres:
  bugunbor-redis:
  bugunbor-minio:
