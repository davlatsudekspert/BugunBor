include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/gen/**
  language:
    strict-casts: true
    strict-raw-types: true

formatter:
  page_width: 160

linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
